<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="990" viewBox="0 0 1240 990" role="img" aria-labelledby="title description">
<title id="title">Azure Cost Intelligence: shared five-layer platform</title><desc id="description">Azure Cost Optimizer is implemented. TokenOps and Cost Mapper are future workloads. Five layers separate experience, agent orchestration, tools, deterministic engines and evidence. Microsoft Foundry hosts the current workload's LLM.</desc>
<defs><marker id="platform-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#34495e"/></marker><linearGradient id="layer-5"><stop stop-color="#e5f1ff"/><stop offset="1" stop-color="#f5faff"/></linearGradient><linearGradient id="layer-4"><stop stop-color="#dcf2e9"/><stop offset="1" stop-color="#f3fbf7"/></linearGradient><linearGradient id="layer-3"><stop stop-color="#e9edfb"/><stop offset="1" stop-color="#f7f8ff"/></linearGradient><linearGradient id="layer-2"><stop stop-color="#ffedce"/><stop offset="1" stop-color="#fffaf0"/></linearGradient><linearGradient id="layer-1"><stop stop-color="#dff2f6"/><stop offset="1" stop-color="#f4fbfd"/></linearGradient></defs>
<g font-family="Segoe UI, sans-serif" letter-spacing="0"><rect width="1240" height="990" fill="#ffffff"/>
<text x="42" y="44" font-size="30" font-weight="700" fill="#182d40">Azure Cost Intelligence</text><text x="42" y="73" font-size="18" font-weight="400" fill="#182d40">A shared platform for evidence-backed cost workloads</text>
<g data-node="Azure Cost Optimizer"><rect x="42" y="105" width="362" height="134" rx="8" fill="#eaf3fc" stroke="#005b96" stroke-width="2" /><text x="62" y="131" font-size="12" font-weight="700" fill="#182d40">IMPLEMENTED</text><text x="62" y="161" font-size="21" font-weight="700" fill="#182d40">Azure Cost Optimizer</text><text x="62" y="188" font-size="15" font-weight="400" fill="#182d40">Observed Azure spend</text><text x="62" y="212" font-size="15" font-weight="400" fill="#182d40">Recommendations and reports</text></g><path d="M223 239V294" fill="none" stroke="#34495e" stroke-width="2"  marker-end="url(#platform-arrow)"/><g data-node="Azure TokenOps"><rect x="438" y="105" width="362" height="134" rx="8" fill="#ffffff" stroke="#6d8193" stroke-width="2" stroke-dasharray="6 4"/><text x="458" y="131" font-size="12" font-weight="700" fill="#182d40">FUTURE WORKLOAD</text><text x="458" y="161" font-size="21" font-weight="700" fill="#182d40">Azure TokenOps</text><text x="458" y="188" font-size="15" font-weight="400" fill="#182d40">Token usage and model rates</text><text x="458" y="212" font-size="15" font-weight="400" fill="#182d40">Cost attributed to a solution</text></g><path d="M619 239V294" fill="none" stroke="#34495e" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#platform-arrow)"/><g data-node="Azure Cost Mapper"><rect x="834" y="105" width="362" height="134" rx="8" fill="#ffffff" stroke="#6d8193" stroke-width="2" stroke-dasharray="6 4"/><text x="854" y="131" font-size="12" font-weight="700" fill="#182d40">FUTURE WORKLOAD</text><text x="854" y="161" font-size="21" font-weight="700" fill="#182d40">Azure Cost Mapper</text><text x="854" y="188" font-size="15" font-weight="400" fill="#182d40">Reviewed diagram + sizing + prices</text><text x="854" y="212" font-size="15" font-weight="400" fill="#182d40">Initial estimate with assumptions</text></g><path d="M1015 239V294" fill="none" stroke="#34495e" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#platform-arrow)"/>
<rect x="42" y="294" width="1154" height="626" rx="10" fill="#f6f8fb" stroke="#8a9eaf" stroke-width="1.5"/>
<text x="66" y="328" font-size="15" font-weight="700" fill="#182d40">SHARED PLATFORM  /  FIVE RESPONSIBILITY LAYERS</text>
<g data-node="Experience"><rect x="66" y="351" width="1106" height="88" rx="8" fill="url(#layer-5)" stroke="#91a5b5"/><rect x="66" y="351" width="5" height="88" rx="2" fill="#005b96"/><circle cx="102" cy="395" r="18" fill="#005b96"/><text x="102" y="401" font-size="18" font-weight="700" text-anchor="middle" fill="#ffffff">5</text><text x="136" y="402" font-size="21" font-weight="700" fill="#182d40">Experience</text><path d="M396 369V421" stroke="#adbdc9"/><text x="420" y="385" font-size="18" font-weight="650" fill="#182d40">Today: curated React workspace and evidence views</text><text x="420" y="414" font-size="16" font-weight="400" fill="#182d40">Future: Microsoft 365 Copilot / Teams via authenticated adapters</text></g><path d="M619 439V460" stroke="#34495e" stroke-width="2" marker-end="url(#platform-arrow)"/><g data-node="Agent orchestration"><rect x="66" y="461" width="1106" height="88" rx="8" fill="url(#layer-4)" stroke="#91a5b5"/><rect x="66" y="461" width="5" height="88" rx="2" fill="#087f68"/><circle cx="102" cy="505" r="18" fill="#087f68"/><text x="102" y="511" font-size="18" font-weight="700" text-anchor="middle" fill="#ffffff">4</text><text x="136" y="512" font-size="21" font-weight="700" fill="#182d40">Agent orchestration</text><path d="M396 479V531" stroke="#adbdc9"/><text x="420" y="495" font-size="18" font-weight="650" fill="#182d40">Explain evidence through typed contracts</text><text x="420" y="524" font-size="16" font-weight="400" fill="#182d40">Today: Agent ACO + Agent Framework; LLM hosted in Foundry</text></g><path d="M619 549V570" stroke="#34495e" stroke-width="2" marker-end="url(#platform-arrow)"/><g data-node="Read-only tools"><rect x="66" y="571" width="1106" height="88" rx="8" fill="url(#layer-3)" stroke="#91a5b5"/><rect x="66" y="571" width="5" height="88" rx="2" fill="#566ba6"/><circle cx="102" cy="615" r="18" fill="#566ba6"/><text x="102" y="621" font-size="18" font-weight="700" text-anchor="middle" fill="#ffffff">3</text><text x="136" y="622" font-size="21" font-weight="700" fill="#182d40">Read-only tools</text><path d="M396 589V641" stroke="#adbdc9"/><text x="420" y="605" font-size="18" font-weight="650" fill="#182d40">Scope, principal and report-bound access</text><text x="420" y="634" font-size="16" font-weight="400" fill="#182d40">Today: 8 Agent ACO tools; optional MCP exposes 9</text></g><path d="M619 659V680" stroke="#34495e" stroke-width="2" marker-end="url(#platform-arrow)"/><g data-node="Deterministic engines"><rect x="66" y="681" width="1106" height="88" rx="8" fill="url(#layer-2)" stroke="#91a5b5"/><rect x="66" y="681" width="5" height="88" rx="2" fill="#935700"/><circle cx="102" cy="725" r="18" fill="#935700"/><text x="102" y="731" font-size="18" font-weight="700" text-anchor="middle" fill="#ffffff">2</text><text x="136" y="732" font-size="21" font-weight="700" fill="#182d40">Deterministic engines</text><path d="M396 699V751" stroke="#adbdc9"/><text x="420" y="715" font-size="18" font-weight="650" fill="#182d40">Exact decimals, currency, dates and financial basis</text><text x="420" y="744" font-size="16" font-weight="400" fill="#182d40">Workload-specific rules, validated totals and provenance</text></g><path d="M619 769V790" stroke="#34495e" stroke-width="2" marker-end="url(#platform-arrow)"/><g data-node="Evidence and data"><rect x="66" y="791" width="1106" height="88" rx="8" fill="url(#layer-1)" stroke="#91a5b5"/><rect x="66" y="791" width="5" height="88" rx="2" fill="#087f96"/><circle cx="102" cy="835" r="18" fill="#087f96"/><text x="102" y="841" font-size="18" font-weight="700" text-anchor="middle" fill="#ffffff">1</text><text x="136" y="842" font-size="21" font-weight="700" fill="#182d40">Evidence and data</text><path d="M396 809V861" stroke="#adbdc9"/><text x="420" y="825" font-size="18" font-weight="650" fill="#182d40">Source adapters and authorized snapshots</text><text x="420" y="854" font-size="16" font-weight="400" fill="#182d40">Today: Cost Management, Advisor, Resource Graph, Blob / Cosmos</text></g>
<text x="42" y="955" font-size="16" font-weight="400" fill="#182d40">Solid: implemented workload. Dashed: future adapters and calculations still need implementation and validation.</text>
<text x="42" y="979" font-size="15" font-weight="400" fill="#182d40">Shared guardrails: authorization, provenance, decimal arithmetic, currency and basis separation, human review.</text>
</g></svg>
